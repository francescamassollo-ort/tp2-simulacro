# Archivo central de versiones (Version Catalog).
# Todas las versiones de dependencias se definen acá para evitar duplicados
# y facilitar actualizaciones. Se referencian desde los build.gradle.kts con libs.xxx

[versions]
agp = "9.3.3"                        # Android Gradle Plugin - herramienta de build de Android
kotlin = "2.2.10"                    # Lenguaje Kotlin
ksp = "2.2.10-2.0.2"               # Kotlin Symbol Processing - procesa anotaciones (@Entity, @Dao, @Inject, etc.) en tiempo de compilación
coreKtx = "1.16.0"                  # Extensiones de Kotlin para Android core
junit = "4.13.2"                     # Framework de tests unitarios
junitVersion = "1.2.1"              # Tests de Android (instrumentados)
espressoCore = "3.6.1"              # Tests de UI en Android
lifecycleRuntimeKtx = "2.9.1"      # Ciclo de vida de Activity/Fragment con corrutinas
activityCompose = "1.10.1"          # Integración de Compose con ComponentActivity
composeBom = "2026.02.01"           # BOM de Compose: fija versiones compatibles entre sí de todas las librerías de Compose
navigationCompose = "2.9.0"         # Navegación entre pantallas en Jetpack Compose
hilt = "2.56"                       # Hilt: librería de inyección de dependencias (basada en Dagger, recomendada por Google)
hiltNavigationCompose = "1.2.0"     # Integración de Hilt con Navigation Compose (para hiltViewModel())
retrofit = "2.11.0"                 # Retrofit: cliente HTTP para consumir APIs REST
room = "2.7.1"                      # Room: capa de abstracción sobre SQLite para base de datos local
# PENDIENTE: agregar ksp con la versión del profe para habilitar Hilt y Room
lifecycleViewmodelCompose = "2.9.1" # ViewModel integrado con Compose (viewModel(), collectAsState())

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Jetpack Compose - UI declarativa de Android
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Navegación
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt - Inyección de dependencias
# Evita crear instancias manualmente; Hilt las provee automáticamente donde se necesiten
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }  # Procesador de anotaciones (ksp)
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Retrofit - Consumo de APIs REST
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }  # Convierte JSON a objetos Kotlin automáticamente

# Room - Base de datos local (SQLite)
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }        # Soporte de corrutinas y Flow en Room
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }  # Procesador de anotaciones (ksp)

# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }  # Necesario para procesar anotaciones de Hilt y Room
